<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ルビサファ ポケモン共有抽選会</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b2940;--accent:#72d6c9;--muted:#aab8ca}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#263c58,#101827 58%);color:#f6f8fb;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100vh}
main{max-width:760px;margin:auto;padding:28px 16px 60px}.top{text-align:center}.tag{color:var(--accent);font-weight:700;letter-spacing:.12em;font-size:.78rem}
h1{font-size:clamp(1.6rem,5vw,2.5rem);margin:8px 0}.sub{color:var(--muted);margin:0 0 22px}
.panel{background:#1b2940ef;border:1px solid #ffffff20;border-radius:22px;padding:20px;box-shadow:0 16px 50px #0004}
.result{display:grid;place-items:center;text-align:center;min-height:290px;background:linear-gradient(145deg,#263c58,#172337);border-radius:18px;padding:18px}
.number{color:var(--accent);font-size:1rem;font-weight:700}.poke{font-size:2rem;font-weight:800;margin:5px 0}.dex{color:var(--muted);font-size:.9rem}
.sprite{width:150px;height:150px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 8px 8px #0005)}
button{border:0;border-radius:14px;padding:15px 18px;font-size:1rem;font-weight:800;cursor:pointer}
.draw{background:var(--accent);color:#10202a;width:100%;margin-top:16px}.draw:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1;background:#34445d;color:white}.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin:16px 2px}
h2{font-size:1.1rem;margin:24px 0 12px}.history{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#30415b;border:1px solid #ffffff18;border-radius:999px;padding:7px 11px;font-size:.9rem}
.empty{color:var(--muted)}.status{font-size:.85rem;color:var(--muted);text-align:center;margin-top:14px}.error{color:#ffb4a9}.notice{font-size:.82rem;line-height:1.6;color:var(--muted);margin-top:20px}
@media(max-width:480px){main{padding-top:20px}.panel{padding:14px}.result{min-height:260px}.sprite{width:130px;height:130px}.poke{font-size:1.7rem}}
</style></head>
<body><main>
<header class="top"><div class="tag">HOENN · NATIONAL DEX 252–386</div><h1>ルビサファ ポケモン共有抽選会</h1><p class="sub">みんなで同じ抽選結果を楽しもう！</p></header>
<section class="panel">
 <div class="result"><div class="number" id="number">抽選待ち</div><img class="sprite" id="sprite" alt="" hidden><div class="poke" id="name">？？？</div><div class="dex" id="dex">ボタンを押して抽選！</div></div>
 <button class="draw" id="draw">🎲 抽選する！</button>
 <div class="actions"><button id="reset">履歴をリセット</button></div>
 <div class="stats"><span id="count">抽選回数：0回</span><span id="status">接続中…</span></div>
 <h2>みんなの抽選履歴</h2><div class="history" id="history"><span class="empty">まだ抽選されていません</span></div>
</section>
<p class="notice">※全員で同じ抽選履歴を共有します。誰かが抽選・リセットすると、開いている全員の画面に反映されます。共有URLを知っている人は誰でも操作できるため、友達だけで使うURLとして扱ってください。</p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDlVEMdmL21KfOz-LH1rzyxEo3Kv_iZjvQ",
  authDomain: "hoenn-pokemon-lottery.firebaseapp.com",
  databaseURL: "https://hoenn-pokemon-lottery-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hoenn-pokemon-lottery",
  storageBucket: "hoenn-pokemon-lottery.firebasestorage.app",
  messagingSenderId: "637178079778",
  appId: "1:637178079778:web:43e497b6ad1cf4d7f7387b"
};
const names = ["キモリ", "ジュプトル", "ジュカイン", "アチャモ", "ワカシャモ", "バシャーモ", "ミズゴロウ", "ヌマクロー", "ラグラージ", "ポチエナ", "グラエナ", "ジグザグマ", "マッスグマ", "ケムッソ", "カラサリス", "アゲハント", "マユルド", "ドクケイル", "ハスボー", "ハスブレロ", "ルンパッパ", "タネボー", "コノハナ", "ダーテング", "スバメ", "オオスバメ", "キャモメ", "ペリッパー", "ラルトス", "キルリア", "サーナイト", "アメタマ", "アメモース", "キノココ", "キノガッサ", "ナマケロ", "ヤルキモノ", "ケッキング", "ツチニン", "テッカニン", "ヌケニン", "ゴニョニョ", "ドゴーム", "バクオング", "マクノシタ", "ハリテヤマ", "ルリリ", "ノズパス", "エネコ", "エネコロロ", "ヤミラミ", "クチート", "ココドラ", "コドラ", "ボスゴドラ", "アサナン", "チャーレム", "ラクライ", "ライボルト", "プラスル", "マイナン", "バルビート", "イルミーゼ", "ロゼリア", "ゴクリン", "マルノーム", "キバニア", "サメハダー", "ホエルコ", "ホエルオー", "ドンメル", "バクーダ", "コータス", "バネブー", "ブーピッグ", "パッチール", "ナックラー", "ビブラーバ", "フライゴン", "サボネア", "ノクタス", "チルット", "チルタリス", "ザングース", "ハブネーク", "ルナトーン", "ソルロック", "ドジョッチ", "ナマズン", "ヘイガニ", "シザリガー", "ヤジロン", "ネンドール", "リリーラ", "ユレイドル", "アノプス", "アーマルド", "ヒンバス", "ミロカロス", "ポワルン", "カクレオン", "カゲボウズ", "ジュペッタ", "ヨマワル", "サマヨール", "トロピウス", "チリーン", "アブソル", "ソーナノ", "ユキワラシ", "オニゴーリ", "タマザラシ", "トドグラー", "トドゼルガ", "パールル", "ハンテール", "サクラビス", "ジーランス", "ラブカス", "タツベイ", "コモルー", "ボーマンダ", "ダンバル", "メタング", "メタグロス", "レジロック", "レジアイス", "レジスチル", "ラティアス", "ラティオス", "カイオーガ", "グラードン", "レックウザ", "ジラーチ", "デオキシス"];
const $ = id => document.getElementById(id);
let db;
function setStatus(s,bad=false){$("status").textContent=s;$("status").className=bad?"error":""}
function render(state){
 const history=state?.history||[];$("count").textContent=`抽選回数：${history.length}回`;
 const last=history[history.length-1];
 if(last){const n=last.n;$("number").textContent=`抽選番号 ${n}`;$("name").textContent=names[n-1];$("dex").textContent=`全国図鑑 No.${n+251}`;$("sprite").src=`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${n+251}.png`;$("sprite").alt=names[n-1];$("sprite").hidden=false}
 else{$("number").textContent="抽選待ち";$("name").textContent="？？？";$("dex").textContent="ボタンを押して抽選！";$("sprite").hidden=true}
 const box=$("history");box.replaceChildren();
 if(!history.length){const e=document.createElement("span");e.className="empty";e.textContent="まだ抽選されていません";box.append(e);return}
 history.slice().reverse().forEach((item,i)=>{const chip=document.createElement("span");chip.className="chip";chip.textContent=`${history.length-i}. ${names[item.n-1]}（${item.n}）`;box.append(chip)});
}
function ready(){
 try{
  if(Object.values(firebaseConfig).some(v=>v.startsWith("ここに"))){setStatus("Firebase設定が必要です",true);$("draw").disabled=true;return}
  firebase.initializeApp(firebaseConfig);const db=firebase.database();const ref=db.ref("rooms/hoenn-shared/state");
  db.ref(".info/connected").on("value",s=>setStatus(s.val()?"オンライン共有中":"再接続中…"));
  ref.on("value",s=>render(s.val()),e=>setStatus("読み込みエラー："+e.message,true));
  $("draw").addEventListener("click",async()=>{$("draw").disabled=true;try{await ref.transaction(current=>{current=current||{history:[]};current.history=current.history||[];current.history.push({n:Math.floor(Math.random()*135)+1,at:Date.now()});return current})}catch(e){setStatus("抽選失敗："+e.message,true)}finally{$("draw").disabled=false}});
  $("reset").addEventListener("click",async()=>{if(!confirm("全員の抽選履歴をリセットします。よろしいですか？"))return;try{await ref.set({history:[]})}catch(e){setStatus("リセット失敗："+e.message,true)}});
 }catch(e){setStatus("初期化エラー："+e.message,true)}
}
ready();
</script></body></html>
